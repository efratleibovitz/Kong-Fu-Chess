services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: .
    command: python -m server.api.app
    environment:
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ws-gateway:
    build: .
    command: python -m server.gateway.app
    environment:
      NUM_SHARDS: "2"
      REDIS_URL: redis://redis:6379
      GATEWAY_HEALTH_PORT: "8768"
    ports:
      - "8765:8765"
      - "8768:8768"
    depends_on:
      redis:
        condition: service_healthy
      game-server-0:
        condition: service_started
      game-server-1:
        condition: service_started

  matchmaking:
    build: .
    command: python -m server.matchmaking.app
    environment:
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
      NUM_SHARDS: "2"
      REDIS_URL: redis://redis:6379
      MATCHMAKING_HEALTH_PORT: "8767"
    ports:
      - "8766:8766"
      - "8767:8767"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-server-0:
        condition: service_started
      game-server-1:
        condition: service_started

  game-server-0:
    build: .
    command: python -m server.game.shard_app
    environment:
      SHARD_INDEX: "0"
      NUM_SHARDS: "2"
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
      REDIS_URL: redis://redis:6379
      SHARD_HEALTH_PORT: "9601"
    ports:
      - "9601:9601"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No published ports - internal-only, reached by ws-gateway/matchmaking
    # over the Docker network at game-server-0:9600.

  game-server-1:
    build: .
    command: python -m server.game.shard_app
    environment:
      SHARD_INDEX: "1"
      NUM_SHARDS: "2"
      DATABASE_URL: postgresql://chess:chess@postgres:5432/chess
      REDIS_URL: redis://redis:6379
      SHARD_HEALTH_PORT: "9602"
    ports:
      - "9602:9602"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
